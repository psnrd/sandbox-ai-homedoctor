name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html demo.css theme.css placement.css climate.css demo.js placement.js climate.js _site/
          cp -r assets _site/assets

      - name: Upload artifact
        if: ${{ steps.pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.pages.outcome == 'success' }}
        uses: actions/deploy-pages@v4

      - name: Skip deploy when Pages is not configured
        if: ${{ steps.pages.outcome != 'success' }}
        run: |
          echo "GitHub Pages is not enabled for this repository yet, so deployment was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "Enable Pages and configure it to build from GitHub Actions to deploy this site." >> "$GITHUB_STEP_SUMMARY"

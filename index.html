<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b315c" />
  <title>AIホームドクター</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-row">
        <button class="icon-button" aria-label="戻る">‹</button>
        <div class="brand">AIホームドクター</div>
        <button class="icon-button" aria-label="メニュー">☰</button>
      </div>
    </header>

    <main class="content">
      <section class="hero-card">
        <div class="eyebrow">ホームヘルススコア</div>
        <div class="score-wrap">
          <div class="score-ring" style="--score:82">
            <div class="score-inner">
              <div class="score-number">82</div>
              <div class="score-unit">/100</div>
            </div>
          </div>
          <div class="score-meta">
            <span class="pill good">良好</span>
            <span class="delta">前日比 +3</span>
          </div>
        </div>
        <p class="summary">今日の住まいは概ね良好です。<br>北側収納と床下に注意ポイントがあります。</p>
      </section>

      <section class="section">
        <div class="section-title-row">
          <h2>住まいの健康状態</h2>
          <span class="updated">15:42 更新</span>
        </div>
        <div id="healthList" class="health-list"></div>
      </section>

      <section class="section advice-card">
        <div class="advice-icon">✦</div>
        <div>
          <div class="eyebrow">AIホームドクターから</div>
          <h3>今やると良いこと</h3>
          <p>北側収納を30分ほど換気すると、カビ・結露リスクの改善が見込めます。</p>
          <button class="primary-button" data-open="mold">詳しく見る</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active"><span>⌂</span><small>ホーム</small></button>
      <button class="nav-item"><span>◷</span><small>履歴</small></button>
      <button class="nav-item"><span>♙</span><small>アドバイス</small></button>
      <button class="nav-item"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <section class="bottom-sheet" id="bottomSheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheetClose" aria-label="閉じる">×</button>
    <div id="sheetContent"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
